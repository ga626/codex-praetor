name: Release Pipeline

on:
  workflow_call:
    inputs:
      publish:
        description: "Publish the already-validated candidate from main."
        required: true
        type: boolean
      base_ref:
        description: "Target branch commit used for release-impact comparison."
        required: false
        type: string

# Candidate builds and proves exactly one ZIP. Main only resolves, verifies and
# promotes that ZIP; it never performs a second packaging build.
jobs:
  candidate_or_release:
    runs-on: windows-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # pull_request defaults to GitHub's synthetic merge ref. A candidate
          # artifact and its provider evidence must instead use the immutable
          # PR head; publication keeps the actual main commit.
          ref: ${{ inputs.publish && github.sha || github.event.pull_request.head.sha }}

      - name: Assert checkout identity
        if: ${{ !inputs.publish }}
        shell: pwsh
        run: |
          $expected = '${{ github.event.pull_request.head.sha }}'.ToLowerInvariant()
          $actual = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($actual -ne $expected) { throw "Candidate checkout is not the PR head. expected=$expected actual=$actual" }
          Write-Host "[PASS] Candidate checkout identity: $actual"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - name: Classify release impact
        id: release_impact
        shell: pwsh
        run: |
          $classification = & powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify\test-release-intent.ps1 `
            -BaseRef '${{ inputs.base_ref }}' `
            -RequireReleaseImpact
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $releaseImpact = (($classification | Out-String) -match 'Pipeline classification: release_impact')
          "release_impact=$($releaseImpact.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Materialize release PR evidence
        if: ${{ steps.release_impact.outputs.release_impact == 'true' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = '${{ github.repository }}'
          $publish = '${{ inputs.publish }}' -eq 'true'
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          if ($publish) {
            $uri = "https://api.github.com/repos/$repo/commits/${{ github.sha }}/pulls"
            $pulls = @(Invoke-RestMethod -Method Get -Uri $uri -Headers $headers)
            $pull = @($pulls | Select-Object -First 1)
          } else {
            $number = '${{ github.event.pull_request.number }}'
            if ([string]::IsNullOrWhiteSpace($number)) { throw 'Provider evidence requires a pull request context.' }
            $uri = "https://api.github.com/repos/$repo/pulls/$number"
            $pull = Invoke-RestMethod -Method Get -Uri $uri -Headers $headers
          }
          if ($null -eq $pull -or [string]::IsNullOrWhiteSpace([string]$pull.body)) { throw 'The release PR has no evidence body.' }
          $body = [string]$pull.body
          New-Item -ItemType Directory -Path '.codex-praetor' -Force | Out-Null
          function Materialize-JsonMarker([string]$Marker, [string]$Path, [bool]$Required) {
            $markerIndex = $body.IndexOf($Marker, [System.StringComparison]::Ordinal)
            if ($markerIndex -lt 0) { if ($Required) { throw "Missing required PR evidence marker: $Marker" }; return }
            $tail = $body.Substring($markerIndex + $Marker.Length)
            $match = [regex]::Match($tail, '(?s)```json\s*(.*?)\s*```')
            if (-not $match.Success) { throw "PR evidence marker is not followed by JSON: $Marker" }
            $json = $match.Groups[1].Value.Trim()
            $null = $json | ConvertFrom-Json
            Set-Content -LiteralPath $Path -Value ($json + [Environment]::NewLine) -Encoding UTF8
          }
          Materialize-JsonMarker '<!-- codex-praetor-provider-release-evidence -->' '.codex-praetor/provider-release-evidence.json' $true
          Materialize-JsonMarker '<!-- codex-praetor-candidate-host-receipt -->' '.codex-praetor/candidate-host-receipt.json' $publish
          Write-Host '[PASS] Release PR evidence materialized.'

      - name: Candidate preflight
        if: ${{ !inputs.publish && steps.release_impact.outputs.release_impact == 'true' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $arguments = @('-BaseRef', '${{ inputs.base_ref }}', '-CheckRemote')
          if ('${{ inputs.publish }}' -ne 'true') { $arguments += '-AllowDraftMetadataPlaceholders' }
          & powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify\invoke-release-candidate-preflight.ps1 @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Write verified candidate receipt
        if: ${{ !inputs.publish && steps.release_impact.outputs.release_impact == 'true' }}
        shell: pwsh
        run: |
          $intent = Get-Content .\config\release-intent.json -Raw | ConvertFrom-Json
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\release\write-release-candidate-receipt.ps1 `
            -Version "$($intent.version)" `
            -PullRequestNumber ${{ github.event.pull_request.number }} `
            -HeadSha "${{ github.event.pull_request.head.sha }}" `
            -BaseSha "${{ github.event.pull_request.base.sha }}"

      - name: Upload verified candidate artifact
        if: ${{ !inputs.publish && steps.release_impact.outputs.release_impact == 'true' }}
        id: candidate_artifact
        shell: pwsh
        run: |
          $intent = Get-Content .\config\release-intent.json -Raw | ConvertFrom-Json
          $name = & powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\release\get-release-candidate-artifact-name.ps1 `
            -Version "$($intent.version)" `
            -PullRequestNumber ${{ github.event.pull_request.number }} `
            -HeadSha "${{ github.event.pull_request.head.sha }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "name=$name" >> $env:GITHUB_OUTPUT

      - name: Upload verified candidate artifact files
        if: ${{ !inputs.publish && steps.release_impact.outputs.release_impact == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.candidate_artifact.outputs.name }}
          if-no-files-found: error
          retention-days: 30
          path: |
            .codex-praetor/releases/codex-praetor-setup-*.zip
            .codex-praetor/releases/codex-praetor-setup-*.zip.sha256
            .codex-praetor/releases/codex-praetor-setup-*.artifact.json
            .codex-praetor/releases/codex-praetor-setup-*.candidate.json

      - name: Attest verified candidate ZIP
        if: ${{ !inputs.publish && steps.release_impact.outputs.release_impact == 'true' }}
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: .codex-praetor/releases/codex-praetor-setup-*.zip

      - name: Validate non-release MCP dependency update
        if: ${{ !inputs.publish && steps.release_impact.outputs.release_impact != 'true' }}
        shell: pwsh
        run: |
          git diff --check '${{ inputs.base_ref }}...HEAD'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File .\mcp\scripts\install-mcp-dependencies.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix .\mcp test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install MCP dependencies for promoted artifact verification
        if: ${{ inputs.publish && steps.release_impact.outputs.release_impact == 'true' }}
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\mcp\scripts\install-mcp-dependencies.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate release control plane on main
        if: ${{ inputs.publish && steps.release_impact.outputs.release_impact == 'true' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify\test-release-workflow-readiness.ps1 -CheckRemoteActionPins
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Resolve and verify PR candidate artifact
        if: ${{ inputs.publish && steps.release_impact.outputs.release_impact == 'true' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $intent = Get-Content .\config\release-intent.json -Raw | ConvertFrom-Json
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\release\resolve-release-promotion-artifact.ps1 `
            -Repository "${{ github.repository }}" `
            -MainCommit "${{ github.sha }}" `
            -Version "$($intent.version)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify\test-release-artifact-runtime.ps1 `
            -Version "$($intent.version)" `
            -OutputRoot ".codex-praetor\releases\promoted" `
            -ArtifactManifestPath ".codex-praetor\releases\promoted\codex-praetor-setup-$($intent.version).artifact.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify\test-provider-release-evidence.ps1 `
            -EvidencePath ".codex-praetor\provider-release-evidence.json" `
            -ArtifactManifestPath ".codex-praetor\releases\promoted\codex-praetor-setup-$($intent.version).artifact.json" `
            -BaseRef '${{ inputs.base_ref }}' `
            -PromotionMainCommit "${{ github.sha }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify\test-candidate-host-receipt.ps1 `
            -ReceiptPath ".codex-praetor\candidate-host-receipt.json" `
            -ArtifactManifestPath ".codex-praetor\releases\promoted\codex-praetor-setup-$($intent.version).artifact.json" `
            -PromotionMainCommit "${{ github.sha }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish immutable Release from this exact main commit
        if: ${{ inputs.publish && steps.release_impact.outputs.release_impact == 'true' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $intent = Get-Content .\config\release-intent.json -Raw | ConvertFrom-Json
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\release\publish-github-release-asset.ps1 `
            -Version "$($intent.version)" `
            -Tag "$($intent.tag)" `
            -OutputRoot ".codex-praetor\releases\promoted" `
            -ArtifactManifestPath ".codex-praetor\releases\promoted\codex-praetor-setup-$($intent.version).artifact.json" `
            -AllowDetachedHead `
            -ResumeExistingRelease `
            -Apply
